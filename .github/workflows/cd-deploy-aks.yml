name: CD - Deploy to AKS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - ".github/workflows/cd-deploy-aks.yml"

env:
  RESOURCE_GROUP: aks-rg-lh-we
  AKS_CLUSTER_NAME: aks-lalah
  NAMESPACE: shop
  ACR_LOGIN_SERVER: lhalecommerceacr.azurecr.io
  BACKEND_IMAGE_NAME: ecommerce-backend
  FRONTEND_IMAGE_NAME: ecommerce-frontend

jobs:
  deploy:
    name: Deploy application to AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER_NAME \
            --overwrite-existing

      - name: Create namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create backend secret
        run: |
          kubectl create secret generic backend-secret \
            --namespace $NAMESPACE \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/backend/configmap.yaml
          kubectl apply -f k8s/backend/deployment.yaml
          kubectl apply -f k8s/backend/service.yaml

          kubectl apply -f k8s/frontend/deployment.yaml
          kubectl apply -f k8s/frontend/service.yaml

          kubectl apply -f k8s/ingress.yaml

      - name: Update backend image
        run: |
          kubectl set image deployment/backend \
            backend=$ACR_LOGIN_SERVER/$BACKEND_IMAGE_NAME:${{ github.sha }} \
            -n $NAMESPACE

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=$ACR_LOGIN_SERVER/$FRONTEND_IMAGE_NAME:${{ github.sha }} \
            -n $NAMESPACE

      - name: Check backend rollout
        run: |
          kubectl rollout status deployment/backend -n $NAMESPACE --timeout=180s

      - name: Check frontend rollout
        run: |
          kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=180s

      - name: Show final resources
        run: |
          kubectl get pods -n $NAMESPACE
          kubectl get svc -n $NAMESPACE
          kubectl get ingress -n $NAMESPACE
